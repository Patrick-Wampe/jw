<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu LDC - JPO 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800;900&display=swap');
        
        body { margin: 0; overflow: hidden; font-family: 'Montserrat', sans-serif; user-select: none; background: #87CEEB; }
        
        /* --- UI PREMIUM --- */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: none; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10;
        }

        .hud-panel {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-bottom: 4px solid #0056b3; pointer-events: auto;
        }

        #objective-tracker {
            background: #FF8C00; color: white; border-bottom: 4px solid #cc7000;
            font-weight: 900; font-size: 1.2rem; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px; animation: pulse 2s infinite; pointer-events: none;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .inventory { display: flex; gap: 10px; align-items: center; }
        .item-slot { font-weight: 800; font-size: 1.1rem; color: #333; opacity: 0.3; filter: grayscale(100%); transition: 0.4s; display: flex; align-items: center; gap: 5px; background: #f0f0f0; padding: 5px 10px; border-radius: 8px;}
        .item-slot.collected { opacity: 1; filter: grayscale(0%); color: #0056b3; transform: scale(1.1); border: 2px solid #0056b3; background: #e0f7fa; }

        #timer-box { font-weight: 900; font-size: 1.4rem; color: #d32f2f; pointer-events: none; margin-bottom: 10px; display: inline-block;}
        
        button.action-btn {
            background: #e74c3c; color: white; border: none; padding: 10px 15px;
            border-radius: 8px; font-weight: 800; font-family: inherit; cursor: pointer;
            border-bottom: 3px solid #c0392b; transition: 0.1s; display: flex; align-items: center; gap: 5px;
        }
        button.action-btn:active { transform: translateY(3px); border-bottom: 0px; }
        button#music-btn { background: #2ecc71; border-bottom: 3px solid #27ae60; width: 100%; justify-content: center;}

        /* --- MENUS --- */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #d4d3ed 0%, #d4d3ed 100%);
            display: flex; justify-content: center; align-items: center; color: #333; z-index: 20;
        }

        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .screen.active { display: flex; }

        .main-title-container { position: relative; z-index: 5; margin-bottom: 40px; text-align: center; }
        .main-title-container img { max-width: 800px; width: 90%; height: auto; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.3)); }

        .btn-accueil { background-color: #FF8C00; color: white; border: 4px solid white; border-radius: 50px; padding: 15px 40px; font-size: 1.5rem; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: all 0.2s ease-in-out; font-family: 'Montserrat', sans-serif; position: relative; z-index: 30; }
        .btn-accueil:hover { transform: scale(1.05); background-color: #e67e22; }

        @keyframes float-anim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .floating-item { position: absolute; z-index: 10; pointer-events: none; }
        .floating-item img { width: 100px; height: auto; opacity: 0.9; }

        .selection-container { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; border-top: 10px solid #0056b3; }
        .selection-container h1 { color: #0056b3; font-size: 2.5rem; margin-bottom: 30px; text-transform: uppercase; }
        .cards-row { display: flex; flex-direction: row; gap: 40px; justify-content: center; align-items: center; }
        
        .choice-card { background: #f8f9fa; border: 4px solid #dee2e6; border-radius: 15px; padding: 20px; width: 200px; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; position: relative;}
        .choice-card:hover { transform: translateY(-10px); border-color: #FF8C00; box-shadow: 0 10px 20px rgba(255, 140, 0, 0.3); }
        .choice-card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 15px; image-rendering: crisp-edges; }
        .choice-card h3 { margin: 0; font-size: 1.2rem; color: #333; }
        
        .locked-card { opacity: 0.6; cursor: not-allowed; filter: grayscale(80%); }
        .locked-card:hover { transform: none; border-color: #dee2e6; box-shadow: none; }
        .locked-badge { position: absolute; top: -15px; right: -15px; background: #e74c3c; color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .btn-retour { margin-top: 30px; padding: 10px 25px; background: #7f8c8d; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit;}

        #message-area { position: absolute; top: 120px; width: 100%; text-align: center; pointer-events: none; z-index: 5; }
        .pop-msg { font-size: 1.6rem; font-weight: 900; color: #FFF; background: #0056b3; padding: 15px 40px; border-radius: 50px; border: 4px solid white; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.3); animation: popUp 3s forwards; }
        @keyframes popUp { 0% { opacity: 0; transform: translateY(-20px) scale(0.8); } 10% { opacity: 1; transform: translateY(0) scale(1.1); } 20% { transform: scale(1); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-50px); } }

        #controls-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: rgba(255,255,255,0.9); font-weight: 800; font-size: 1.1rem; pointer-events: none; text-shadow: 0 2px 5px rgba(0,0,0,0.6); z-index: 5; }
    </style>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

            <div class="floating-item" style="top: 15%; left: 20%; animation: float-anim 7s infinite ease-in-out;"><img src="images/Bible.png"></div>

            <div class="floating-item" style="top: 12%; left: 60%; animation: float-anim 8s infinite ease-in-out;"><img src="images/brique2.png"></div>
            <div class="floating-item" style="top: 5%; left: 80%; animation: float-anim 5.5s infinite ease-in-out;"><img src="images/brique3.png"></div>
            <div class="floating-item" style="top: 18%; left: 90%; animation: float-anim 6.5s infinite ease-in-out;"><img src="images/brique4.png"></div>

            <div class="floating-item" style="bottom: 5%; left: 70%; animation: float-anim 5.5s infinite ease-in-out;"><img src="images/paillette5.png"></div>
            <div class="floating-item" style="bottom: 18%; left: 85%; animation: float-anim 7.5s infinite ease-in-out;"><img src="images/paillette6.png"></div>
            <div class="floating-item" style="top: 25%; left: 30%; animation: float-anim 6s infinite ease-in-out;"><img src="images/paillette7.png"></div>
            <div class="floating-item" style="top: 28%; left: 70%; animation: float-anim 7s infinite ease-in-out;"><img src="images/paillette8.png"></div>
            <div class="floating-item" style="bottom: 25%; left: 20%; animation: float-anim 5s infinite ease-in-out;"><img src="images/paillette9.png"></div>
            <div class="floating-item" style="bottom: 22%; left: 60%; animation: float-anim 6.5s infinite ease-in-out;"><img src="images/paillette10.png"></div>
            <div class="floating-item" style="top: 80%; left: 45%; animation: float-anim 8s infinite ease-in-out;"><img src="images/plot.png"></div>
            <div class="floating-item" style="top: 85%; left: 55%; animation: float-anim 5.5s infinite ease-in-out;"><img src="images/rapporteur.png"></div>
        </div>

        <!-- SÉLECTION PERSONNAGE -->
        <div class="screen" id="char-select-screen">
            <div class="selection-container">
                <h1>Choisis ton profil</h1>
                <div class="cards-row">
                    <div class="choice-card" onclick="selectChar('garcon')">
                        <img src="images/mascottehomme.png" alt="Garçon">

        <!-- SÉLECTION MISSION -->
        <div class="screen" id="mission-select-screen">

                <h1>Choisis ta mission</h1>

                    <div class="choice-card" onclick="selectMission(1)" style="border-color: #2ecc71;">

                    <div class="choice-card" onclick="selectMission(2)" style="border-color: #3498db;">

                    <button class="action-btn" style="background:#0056b3; border-color:#004085; padding: 15px 30px; font-size: 1.2rem;" onclick="retryMission()">Rejouer</button>

    <div id="controls-hint">Flèches ou ZQSD pour bouger • Espace pour sauter</div>

    <script type="module">
        import * as THREE from 'three';

        // --- GESTION MUSIQUE ---
        let ambientMusic = new Audio("musiques/menu.mp3"); ambientMusic.loop = true;
        let musicM1 = new Audio("musiques/mission1.mp3"); musicM1.loop = true;
        let musicM2 = new Audio("musiques/mission2.mp3"); musicM2.loop = true; // NOUVEAU
        let currentMusic = ambientMusic; let isMusicPlaying = true;

        document.body.addEventListener('click', () => { if(currentMusic.paused && isMusicPlaying) currentMusic.play().catch(e=>{}); }, { once: true });
        document.getElementById('music-btn').addEventListener('click', (e) => {
            e.stopPropagation(); 
            if(isMusicPlaying) { currentMusic.pause(); document.getElementById('music-btn').innerText = "🔇 MUSIQUE"; document.getElementById('music-btn').style.background = "#e74c3c"; } 
            else { currentMusic.play(); document.getElementById('music-btn').innerText = "🔊 MUSIQUE"; document.getElementById('music-btn').style.background = "#2ecc71"; }
            isMusicPlaying = !isMusicPlaying;
        });

        // --- NAVIGATION ---
        window.goToTitle = () => { document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById('title-screen').classList.add('active'); }
        window.goToCharSelect = () => { document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById('char-select-screen').classList.add('active'); }
        window.goToMissionSelect = () => { document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active')); document.getElementById('mission-select-screen').classList.add('active'); document.getElementById('ui-layer').style.display = 'none'; }
        window.selectChar = (char) => { gameState.selectedChar = char; goToMissionSelect(); }
        window.selectMission = (mission) => { gameState.selectedMission = mission; startGame(); }
        window.retryMission = () => { startGame(); }
        window.quitGame = () => { gameState.running = false; document.getElementById('ui-layer').style.display = 'none'; document.getElementById('overlay').style.display = 'flex'; currentMusic.pause(); currentMusic = ambientMusic; if(isMusicPlaying) currentMusic.play(); goToMissionSelect(); }

        // --- MOTEUR 3D ---
        const CONFIG = { SPEED: 38, JUMP_FORCE: 35, SUPER_JUMP: 50, GRAVITY: 90, TOTAL_TIME: 240 };
        
        let scene, camera, renderer, clock, worldGroup, playerGroup;
        let groundColliders = [], missionItems = [], animatedDecor = [], npcs = [];
        let theTruck = null;
        let playerBodyParts = {};
        let textureLoader = new THREE.TextureLoader();
        let raycaster = new THREE.Raycaster(), downVector = new THREE.Vector3(0, -1, 0);

        let gameState = {
            running: false, itemsCollected: 0, timeLeft: CONFIG.TOTAL_TIME,
            velocity: new THREE.Vector3(), onGround: false, hasBible: false, 
            selectedChar: 'garcon', missionPhase: 0
        };

        const keys = { w: false, s: false, a: false, d: false, space: false };

        function init() {
            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x87CEEB); // Beau ciel bleu
            scene.fog = new THREE.Fog(0x87CEEB, 150, 400); // Brume pour la profondeur

            const aspect = window.innerWidth / window.innerHeight; const d = 40; 
            camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 1, 1000);
            camera.position.set(50, 60, 50); camera.lookAt(scene.position);

            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambientLight);
            const sunLight = new THREE.DirectionalLight(0xffffee, 0.8); sunLight.position.set(100, 200, 50);
            sunLight.castShadow = true; 
            sunLight.shadow.camera.left = -150; sunLight.shadow.camera.right = 150;
            sunLight.shadow.camera.top = 150; sunLight.shadow.camera.bottom = -150;
            scene.add(sunLight);

            worldGroup = new THREE.Group(); scene.add(worldGroup);
            clock = new THREE.Clock();

            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', e => onKey(e, true)); document.addEventListener('keyup', e => onKey(e, false));
            animate();
        }

        // --- CRÉATEURS 3D DE BEAUTÉ ---
        function clearWorld() {
            while(worldGroup.children.length > 0) worldGroup.remove(worldGroup.children[0]);
            groundColliders = []; missionItems = []; animatedDecor = []; theTruck = null; npcs = []; // Ajout de npcs = []
            if(playerGroup) { scene.remove(playerGroup); playerGroup = null; }
        }

        function createBeautifulSign(text, bgColor, textColor, x, z, rotationY) {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Fond avec bordure
            ctx.fillStyle = bgColor; ctx.fillRect(0,0,1024,256);
            ctx.strokeStyle = textColor; ctx.lineWidth = 15; ctx.strokeRect(10, 10, 1004, 236);
            
            // Texte
            ctx.fillStyle = textColor; ctx.font = 'bold 85px Montserrat'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 512, 128);
            
            const tex = new THREE.CanvasTexture(canvas); tex.colorSpace = THREE.SRGBColorSpace;
            const mat = new THREE.MeshStandardMaterial({ map: tex });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 1), mat);
            mesh.position.set(x, 4, z); mesh.rotation.y = rotationY; mesh.castShadow = true;
            
            const poteau = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6), new THREE.MeshStandardMaterial({color:0x555555}));
            poteau.position.set(x, 3, z); poteau.castShadow = true;
            
            worldGroup.add(mesh); worldGroup.add(poteau); groundColliders.push(poteau);
        }

        function createBeautifulTree(x, z) {
            const grp = new THREE.Group(); grp.position.set(x, 0, z);
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 6), new THREE.MeshStandardMaterial({color: 0x6E4B3A})); 
            trunk.position.y = 3; trunk.castShadow = true;
            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(5, 1), new THREE.MeshStandardMaterial({color: 0x2ecc71, flatShading: true})); 
            leaves.position.y = 8; leaves.castShadow = true;
            grp.add(trunk, leaves); worldGroup.add(grp); groundColliders.push(trunk);
        }

        function createBench(x, z, rotY) {
            const grp = new THREE.Group(); grp.position.set(x, 1, z); grp.rotation.y = rotY;
            const wood = new THREE.MeshStandardMaterial({color: 0xD4A373}); const iron = new THREE.MeshStandardMaterial({color: 0x2c3e50});
            const seat = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 3), wood); seat.position.y = 1.5; seat.castShadow = true;
            const back = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 0.5), wood); back.position.set(0, 3.5, -1.25); back.castShadow = true;
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 2.5), iron); leg1.position.set(-3.5, 0.5, 0); leg1.castShadow = true;
            const leg2 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2, 2.5), iron); leg2.position.set(3.5, 0.5, 0); leg2.castShadow = true;
            grp.add(seat, back, leg1, leg2); worldGroup.add(grp); groundColliders.push(seat);
        }

        function createCloud(x, y, z) {
            const grp = new THREE.Group(); grp.position.set(x, y, z);
            const mat = new THREE.MeshLambertMaterial({color: 0xffffff, transparent: true, opacity: 0.9});
            const p1 = new THREE.Mesh(new THREE.SphereGeometry(6), mat);
            const p2 = new THREE.Mesh(new THREE.SphereGeometry(5), mat); p2.position.set(4, -1, 2);
            const p3 = new THREE.Mesh(new THREE.SphereGeometry(4), mat); p3.position.set(-4, -1, -2);
            grp.add(p1, p2, p3); worldGroup.add(grp);
            animatedDecor.push({type: 'cloud', mesh: grp, speed: Math.random() * 2 + 1}); 
        }

        function createButterfly(x, y, z) {
            const colors = [0xFF69B4, 0x00BFFF, 0xFFD700, 0x32CD32];
            const mat = new THREE.MeshBasicMaterial({color: colors[Math.floor(Math.random()*colors.length)], side: THREE.DoubleSide});
            const wing1 = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); wing1.position.x = 0.5;
            const wing2 = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat); wing2.position.x = -0.5;
            const grp = new THREE.Group(); grp.add(wing1, wing2); grp.position.set(x, y, z); worldGroup.add(grp);
            animatedDecor.push({type: 'butterfly', mesh: grp, w1: wing1, w2: wing2, timeOffset: Math.random()*10, baseX: x, baseZ: z});
        }

        // Ajout d'Oiseaux dans le ciel !
        function createBird(yBase) {
            const grp = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({color: 0x333333, side: THREE.DoubleSide});
            const w1 = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), mat); w1.position.set(1, 0, 0);
            const w2 = new THREE.Mesh(new THREE.PlaneGeometry(2, 1), mat); w2.position.set(-1, 0, 0);
            grp.add(w1, w2);
            
            let x = (Math.random()-0.5)*300; let z = (Math.random()-0.5)*300;
            grp.position.set(x, yBase, z); worldGroup.add(grp);
            
            animatedDecor.push({
                type: 'bird', mesh: grp, w1: w1, w2: w2, 
                speedX: (Math.random() * 15 + 15) * (Math.random()>0.5?1:-1), speedZ: (Math.random() * 15 + 15) * (Math.random()>0.5?1:-1),
                baseY: yBase, timeOffset: Math.random()*10
            });
        }

        // Ajout de Volontaires qui marchent sur le chantier !
        function createWorker(x, z, axis, range, speed, shirtColor) {
            const grp = new THREE.Group();
            const matShirt = new THREE.MeshLambertMaterial({color: shirtColor});

        function onKey(e,p){const k=e.code;if(['KeyW','ArrowUp'].includes(k))keys.w=p;if(['KeyS','ArrowDown'].includes(k))keys.s=p;if(['KeyA','ArrowLeft'].includes(k))keys.a=p;if(['KeyD','ArrowRight'].includes(k))keys.d=p;if(k==='Space')keys.space=p;}

        function updatePhysics(dt) {
            if (!playerGroup) return; 

            // --- ANIMATIONS DE L'ENVIRONNEMENT ---
            animatedDecor.forEach(item => {
                if(item.type === 'butterfly') {
                    item.mesh.position.y += Math.sin(clock.elapsedTime * 5 + item.timeOffset) * 0.05;
                    item.mesh.position.x = item.baseX + Math.sin(clock.elapsedTime * 2 + item.timeOffset) * 10;
                    item.mesh.position.z = item.baseZ + Math.cos(clock.elapsedTime * 2 + item.timeOffset) * 10;
                    item.w1.rotation.y = Math.sin(clock.elapsedTime * 20) * 0.8;
                    item.w2.rotation.y = -Math.sin(clock.elapsedTime * 20) * 0.8;
                    item.mesh.lookAt(item.mesh.position.x + Math.cos(clock.elapsedTime * 2 + item.timeOffset), item.mesh.position.y, item.mesh.position.z - Math.sin(clock.elapsedTime * 2 + item.timeOffset));
                } 
                else if(item.type === 'bird') {
                    item.mesh.position.x += item.speedX * dt; item.mesh.position.z += item.speedZ * dt;
                    item.mesh.position.y = item.baseY + Math.sin(clock.elapsedTime * 3 + item.timeOffset) * 2;
                    if(item.mesh.position.x > 250) item.mesh.position.x = -250; if(item.mesh.position.x < -250) item.mesh.position.x = 250;
                    if(item.mesh.position.z > 250) item.mesh.position.z = -250; if(item.mesh.position.z < -250) item.mesh.position.z = 250;
                    item.mesh.lookAt(item.mesh.position.x + item.speedX, item.mesh.position.y, item.mesh.position.z + item.speedZ);
                    item.w1.rotation.z = Math.sin(clock.elapsedTime * 15 + item.timeOffset) * 0.5;
                    item.w2.rotation.z = -Math.sin(clock.elapsedTime * 15 + item.timeOffset) * 0.5;
                }
                else if(item.type === 'worker') {
                    let t = clock.elapsedTime * item.speed + item.timeOffset;
                    let currentPos = item.basePos + Math.sin(t) * item.range;
                    item.mesh.position[item.axis] = currentPos;
                    if (item.collider) item.collider.position[item.axis] = currentPos;
                    let isForward = Math.cos(t) > 0;
                    if(item.axis === 'x') item.mesh.rotation.y = isForward ? Math.PI/2 : -Math.PI/2;
                    else item.mesh.rotation.y = isForward ? 0 : Math.PI;
                    let walkAnim = Math.sin(t * 4) * 0.5;
                    item.parts.armL.rotation.x = walkAnim; item.parts.armR.rotation.x = -walkAnim;
                    item.parts.legL.rotation.x = -walkAnim; item.parts.legR.rotation.x = walkAnim;
                }
                else { // Clouds
                    item.mesh.position.x -= item.speed * dt;
                    if(item.mesh.position.x < -250) item.mesh.position.x = 250;
                }
            });

            if (gameState.missionPhase === 2) {
                if(theTruck) { theTruck.position.x += 35 * dt; } // Le camion part
                return; // Bloque le joueur
            }

            // --- PHYSIQUE DU JOUEUR ---
            const dir = new THREE.Vector3(); if(keys.w)dir.z-=1;if(keys.s)dir.z+=1;if(keys.a)dir.x-=1;if(keys.d)dir.x+=1;if(dir.length()>0)dir.normalize();
            const speed = gameState.hasBible ? CONFIG.SPEED * 1.5 : CONFIG.SPEED; 
            
            if(dir.length()>0){
                gameState.velocity.x=dir.x*speed; gameState.velocity.z=dir.z*speed;
                playerGroup.rotation.y = Math.atan2(gameState.velocity.x, gameState.velocity.z);
                // Animation de marche du perso
                let walkCycle = clock.elapsedTime * 15;
                playerBodyParts.armL.rotation.x = Math.sin(walkCycle) * 0.6; playerBodyParts.armR.rotation.x = -Math.sin(walkCycle) * 0.6;
                playerBodyParts.legL.rotation.x = -Math.sin(walkCycle) * 0.6; playerBodyParts.legR.rotation.x = Math.sin(walkCycle) * 0.6;
            } else {
                gameState.velocity.x=0; gameState.velocity.z=0;
                playerBodyParts.armL.rotation.x = 0; playerBodyParts.armR.rotation.x = 0;
                playerBodyParts.legL.rotation.x = 0; playerBodyParts.legR.rotation.x = 0;
            }
            
            gameState.velocity.y -= CONFIG.GRAVITY*dt;
            if(keys.space&&gameState.onGround){gameState.velocity.y = gameState.hasBible ? CONFIG.SUPER_JUMP : CONFIG.JUMP_FORCE; gameState.onGround=false;}
            playerGroup.position.y+=gameState.velocity.y*dt;

            gameState.onGround=false; raycaster.set(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y+5, playerGroup.position.z), downVector);
            const hits=raycaster.intersectObjects(groundColliders);
            if(hits.length>0 && hits[0].distance <= 5.5 && gameState.velocity.y<=0){
                gameState.velocity.y=0; playerGroup.position.y=hits[0].point.y; gameState.onGround=true;
            }

            playerGroup.position.x += gameState.velocity.x*dt; playerGroup.position.z += gameState.velocity.z*dt;
            
            if(playerGroup.position.x > 230) playerGroup.position.x = 230; if(playerGroup.position.x < -230) playerGroup.position.x = -230;
            if(playerGroup.position.z > 230) playerGroup.position.z = 230; if(playerGroup.position.z < -230) playerGroup.position.z = -230;

            // --- COLLECTIBLES ---
            missionItems.forEach(item => { if(item.visible) item.position.y = item.userData.baseY + Math.sin(clock.elapsedTime*3)*0.5; });

            if(gameState.missionPhase === 0) {
                const bible = missionItems.find(i => i.userData.type === 'bible');
                if(bible && playerGroup.position.distanceTo(bible.position) < bible.userData.hitRadius) {
                    bible.visible = false; gameState.hasBible = true; gameState.missionPhase = 1;
                    showMessage("La Bible te donne de la force !"); updateObjectiveUI("Récupère les outils.");
                    missionItems.forEach(i => { if(i.userData.type === 'outil') i.visible = true; }); 
                }
            } else if(gameState.missionPhase === 1) {
                missionItems.forEach((item, index) => {
                    if(item.userData.type === 'outil' && item.visible && playerGroup.position.distanceTo(item.position) < item.userData.hitRadius) {
                        item.visible = false; gameState.itemsCollected++;
                        document.getElementById(`slot-item-${index - 1}`).classList.add('collected');
                        if(gameState.itemsCollected >= 4) {
                            gameState.missionPhase = 2;
                            showMessage("SUPER ! LE CAMION PART POUR LE CHANTIER !");
                            updateObjectiveUI("Chantier en cours d'approvisionnement...");
                            setTimeout(() => gameOver(true, "Tous les outils ont été livrés ! Bon travail !"), 4000);
                        }
                    }
                });
            }
        }

        window.gameOver = function(win, msg) {
            gameState.running = false; 
            document.getElementById('ui-layer').style.display = 'none'; document.getElementById('overlay').style.display = 'flex'; 
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); document.getElementById('game-end-screen').classList.add('active');
            if(win) { document.getElementById('end-title').innerText = "Mission accomplie!"; document.getElementById('end-title').style.color = "#2ecc71"; } 
            else { document.getElementById('end-title').innerText = "Fin de journée"; document.getElementById('end-title').style.color = "#d32f2f"; }
            document.getElementById('end-message').innerText = msg; 
        }

        function onResize() { if(camera){ const aspect = window.innerWidth / window.innerHeight; camera.left = -CONFIG.ZOOM * aspect; camera.right = CONFIG.ZOOM * aspect; camera.top = CONFIG.ZOOM; camera.bottom = -CONFIG.ZOOM; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }}
        
        function animate() { 
            requestAnimationFrame(animate); if(!clock) return; const dt = Math.min(clock.getDelta(), 0.05); 
            if (gameState.running && playerGroup) { 
                updatePhysics(dt); 
                
                // --- CAMÉRA ULTRA-STABLE (Lerp) ---
                let targetPos = playerGroup.position;
                if (gameState.missionPhase === 2 && theTruck) targetPos = theTruck.position;

                // La caméra glisse doucement sans trembler !
                const targetCamX = targetPos.x + 50; const targetCamZ = targetPos.z + 50;
                camera.position.x += (targetCamX - camera.position.x) * 0.08;
                camera.position.z += (targetCamZ - camera.position.z) * 0.08;
                
                camera.lookAt(camera.position.x - 50, camera.position.y - 60, camera.position.z - 50);

                renderer.render(scene, camera); 
            } 
        }
    </script>
</body>
</html>
