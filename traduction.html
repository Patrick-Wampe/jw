    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #0072ff;
            --text-dark: #333333;
            --text-light: #777777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white; padding: 20px; text-align: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 20px; margin-bottom: 15px; }

        .lang-selector {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;
            justify-content: flex-start; scrollbar-width: none;
        }
        .lang-selector::-webkit-scrollbar { display: none; }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid transparent;
            color: white; padding: 8px 15px; border-radius: 30px; cursor: pointer;
            font-weight: 600; font-size: 14px; white-space: nowrap; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 5px;
        }
        .lang-btn.active { background: white; color: var(--primary); border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
        .category-title { font-size: 18px; color: var(--primary); margin: 25px 0 15px 0; border-bottom: 2px solid #ddd; padding-bottom: 5px; }

        .phrase-card {
            background: var(--card-bg); border-radius: 12px; padding: 15px 20px;
            margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s ease;
        }
        .phrase-card:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        .text-content { width: 85%; }
        .fr-text { font-size: 14px; color: var(--text-light); margin-bottom: 5px; }
        .translated-text { font-size: 17px; font-weight: 600; color: var(--text-dark); }
        .phonetic-text { font-size: 13px; color: var(--primary); margin-top: 3px; font-style: italic; }

        .audio-btn {
            background: #f0f0f0; border: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s;
        }
        .audio-btn:hover { background: var(--primary); color: white; }
    </style>
</head>

                    { fr: "Merci d'avoir partagé cela.", en: "Thank you for sharing that.", es: "Gracias por compartir eso.", it: "Grazie per averlo condiviso.", pt: "Obrigado por compartilhar isso.", de: "Danke fürs Teilen.", pl: "Dziękuję, że się tym podzieliłeś.", ru: "Спасибо, что поделились этим. (Spasibo, chto podelilis' etim)", kr: "공유해 주셔서 감사합니다. (Gongyuhae jusyeoseo gamsahamnida)", jp: "共有してくれてありがとうございます。 (Kyouyuu shite kurete arigatou gozaimasu)" }

                    { fr: "Vous êtes très gentils.", en: "You are very kind.", es: "Son muy amables.", it: "Siete molto gentili.", pt: "Vocês são muito gentis.", de: "Ihr seid sehr nett.", pl: "Jesteście bardzo mili.", ru: "Вы очень добры. (Vy ochen' dobry)", kr: "정말 친절하시네요. (Jeongmal chinjeolhasineyo)", jp: "とても親切ですね。 (Totemo shinsetsu desu ne)" },

                    { fr: "Voici notre numéro de téléphone.", en: "Here is our phone number.", es: "Aquí está nuestro número.", it: "Ecco il nostro numero.", pt: "Aqui está o nosso número.", de: "Hier ist unsere Nummer.", pl: "Oto nasz numer telefonu.", ru: "Вот наш номер телефона. (Vot nash nomer telefona)", kr: "여기 저희 전화번호입니다. (Yeogi jeohui jeonhwabeonho-imnida)", jp: "これが私たちの電話番号です。 (Kore ga watashitachi no denwabangou desu)" },

                ]
            }
        ];

        function init() {
            renderLanguageSelector();
            renderPhrases();
        }

        function renderLanguageSelector() {
            const container = document.getElementById('langSelector');
            container.innerHTML = '';
            languages.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = `lang-btn ${lang.id === currentLang ? 'active' : ''}`;
                btn.innerHTML = `${lang.flag} ${lang.name}`;
                btn.onclick = () => { currentLang = lang.id; init(); };
                container.appendChild(btn);
            });
        }

        function splitTextAndPhonetic(rawText) {
            if (rawText.includes('(') && rawText.includes(')')) {
                const textPart = rawText.substring(0, rawText.indexOf('(')).trim();
                const phoneticPart = rawText.substring(rawText.indexOf('(') + 1, rawText.indexOf(')')).trim();
                return { text: textPart, phonetic: `Prononciation : ${phoneticPart}` };
            }
            return { text: rawText, phonetic: null };
        }

        function renderPhrases() {
            const container = document.getElementById('phrasesContainer');
            container.innerHTML = '';
            const activeLangConfig = languages.find(l => l.id === currentLang);

            dictionary.forEach(section => {
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerText = section.category;
                container.appendChild(title);

                section.items.forEach(item => {
                    const translationData = splitTextAndPhonetic(item[currentLang]);
                    const cleanTextForSpeech = translationData.text; 
                    
                    const card = document.createElement('div');
                    card.className = 'phrase-card';
                    
                    let phoneticHtml = translationData.phonetic ? `<div class="phonetic-text">${translationData.phonetic}</div>` : '';

                    card.innerHTML = `
                        <div class="text-content">
                            <div class="fr-text">🇫🇷 ${item.fr}</div>
                            <div class="translated-text">${activeLangConfig.flag} ${translationData.text}</div>
                            ${phoneticHtml}
                        </div>
                        <button class="audio-btn" onclick="speakText('${cleanTextForSpeech.replace(/'/g, "\\'")}', '${activeLangConfig.voiceCode}')">🔊</button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function speakText(text, langCode) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }

        init();
    </script>
